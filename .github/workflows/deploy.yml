name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Daily rebuild: catalog SSG (/avto, makes/models) + sitemap.
  # Auction HTML is Cloudflare Function (not Next SSG).
  # 04:00 UTC = 07:00 Europe/Minsk
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Live catalog from Windows API → SSG catalog + sitemap; lots via CF Function
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://91.149.133.54' }}
          SEO_AUCTION_SSG_LIMIT: "0"
          SEO_AUCTION_SITEMAP_LIMIT: "5000"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'multiglobalgroup-website' }}
