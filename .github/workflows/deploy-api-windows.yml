# Деплой MG.GROUP API на Windows Server при push в main.
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST         — IP или домен Windows Server (например 91.149.133.54)
#   SSH_USER         — например Administrator
#   SSH_PRIVATE_KEY  — приватный ключ (весь файл BEGIN/END)
#   SSH_PORT         — опционально, по умолчанию 22
#   APP_DIR          — опционально, по умолчанию C:\mg-api
#
# Без SSH_HOST шаг деплоя пропускается (CI зелёный). Secrets нельзя проверять
# в jobs.*.if — только внутри steps (ограничение GitHub Actions).
#
# Один раз на сервере:
#   git clone https://github.com/romankutuzovdev/mg_group_website.git C:\mg-api
#   powershell -ExecutionPolicy Bypass -File C:\mg-api\api\deploy\install-windows.ps1
name: Deploy API to Windows Server

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "lib/auctions/**"
      - ".github/workflows/deploy-api-windows.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets not set — skipping Windows deploy (add SSH_HOST, SSH_USER, SSH_PRIVATE_KEY)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH (Windows)
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          # Явно PowerShell — не зависит от shell по умолчанию в OpenSSH
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
              $AppDir = '${{ secrets.APP_DIR }}';
              if ([string]::IsNullOrWhiteSpace($AppDir)) { $AppDir = 'C:\mg-api' };
              if (-not (Test-Path (Join-Path $AppDir '.git'))) {
                Write-Host 'На сервере ещё нет git-клона в' $AppDir;
                Write-Host 'Сделайте один раз: git clone <repo>' $AppDir;
                Write-Host 'Затем: powershell -ExecutionPolicy Bypass -File' (Join-Path $AppDir 'api\deploy\install-windows.ps1');
                exit 1
              };
              $env:APP_DIR = $AppDir;
              $env:SKIP_WEBSITE = '1';
              $env:SKIP_CHROME = '0';
              & (Join-Path $AppDir 'api\deploy\update-from-git.ps1')
            "
